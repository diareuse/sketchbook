plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.roborazzi)
    id "publish-conventions"
}

android {
    namespace 'lib.sketchbook'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation libs.bundles.compose
    implementation libs.androidx.palette
    implementation libs.androidx.activity
    implementation libs.coil.compose
    implementation libs.coil.svg
    compileOnly libs.google.haze
    compileOnly libs.androidx.paging

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.junit.rule
    testImplementation libs.compose.ui.test.junit4
    testImplementation libs.compose.ui.test.manifest

}

roborazzi {
    outputDir.set(layout.projectDirectory.dir("src/test/snapshots"))
}

tasks.matching { it.name.endsWith("UnitTestAarMetadata") }.configureEach {
    enabled = false
}
